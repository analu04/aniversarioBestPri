<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz aniversário 💚</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #a8edea, #d4fc79);
    color: #333;
}

.container {
    padding: 20px;
}
button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #20c997;
    color: white;
    cursor: pointer;
    margin-top: 20px;
}

#mensagem {
    margin-top: 20px;
    font-size: 18px;
    white-space: pre-line;
}

#mensagem strong {
    font-size: 22px;
    color: #20c997;
}

.foto {
    display: block;
    margin: 15px auto;
    width: 90%;
    max-width: 300px;
    border-radius: 15px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 1s ease;
}

.foto.mostrar {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<div class="container">
    <h1>Priscila ✨</h1>
<button onclick="iniciarExperiencia()">Clique para começar 💚</button>
    <div id="mensagem"></div>
</div>

<!-- YOUTUBE (música invisível) -->
<div id="player"></div>

<script>
const el = document.getElementById("mensagem");
function adicionarFoto(src) {
    const img = document.createElement("img");
    img.src = src;
    img.classList.add("foto");

    el.appendChild(img);

    setTimeout(() => {
        img.classList.add("mostrar");
    }, 50);
}

const partes = [
    { tempo: 2000, texto: "Feliz aniversário, best 💚" },

    { tempo: 6000, texto: "Eu queria fazer algo diferente, pra fugir da mesmice, sabe?" },

    { tempo: 11000, texto: "Porque você merece algo especial." },

    { tempo: 17000, texto: "Obrigada por ser minha melhor amiga," },
    { tempo: 20000, texto: "por estar sempre comigo, mesmo a gente se encontrando uma vez a cada 6 meses KKKKKK" },

    { tempo: 26000, texto: "pelos nossos momentos," },
    { tempo: 29000, texto: "por me ouvir," },
    { tempo: 32000, texto: "por sempre me apoiar, ou puxar minha orelha quando eu preciso," },

    { tempo: 38000, texto: "por me fazer rir quando sabe que tô prestes a chorar," },
    { tempo: 42000, texto: "por me entender, sabendo o quanto eu sou complicada," },

    { tempo: 48000, texto: "Você é muito importante pra mim." },

    { tempo: 54000, texto: "Eu sou muito grata por ter você na minha vida, e por tudo que a gente já viveu juntas." },

    { tempo: 61000, texto: "Eu amo como você é forte, inteligente, engraçada, e única." },

    { tempo: 68000, texto: "Tenho um imenso orgulho de ser sua amiga, e de tudo que você é." },

    { tempo: 75000, texto: "<strong>Eu te amo mil milhões! 💚</strong>" }
];

let player;

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: '38k5zr1e0HI', // coloca o ID aqui
        playerVars: {
            autoplay: 0,
            loop: 1,
            playlist: '38k5zr1e0HI'
        }
    });
}

function iniciarExperiencia() {

    // tocar música
    player.playVideo();

    // mensagem
    partes.forEach((parte, index) => {
    setTimeout(() => {
        el.innerHTML += parte.texto + "\n\n";

        if (index === 1) adicionarFoto("foto1.jpg");
        if (index === 4) adicionarFoto("foto2.jpg");
        if (index === 6) adicionarFoto("foto3.jpg");
        if (index === 8) adicionarFoto("foto4.jpg");
        if (index === 10) adicionarFoto("foto5.jpg");
        if (index === 14) adicionarFoto("foto6.jpg");
    }, parte.tempo);
});

    event.target.style.display = "none";
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
