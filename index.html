<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oi 👀</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #a8edea, #d4fc79);
}

.container {
    text-align: center;
}

/* FOTO */
.foto {
    width: 40vw;
    max-width: 150px;
    height: auto;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    margin-bottom: 20px;
    animation: aparecer 1.5s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #20c997;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <!-- FOTO DELA -->
    <img src="foto_capa.jpg" class="foto">

    <h2>Tenho uma surpresa pra você 💚</h2>

    <button onclick="ir()">Abrir</button>
</div>

<script>
function ir() {
    document.body.style.opacity = "0";
    setTimeout(() => {
        window.location.href = "surpresa.html";
    }, 500);
}
</script>

</body>
</html>
